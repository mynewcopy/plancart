<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6C63FF">
<title>Вишлист — PlanCart</title>
<link rel="stylesheet" href="/static/css/public.css">
</head>
<body>

<!-- Hero header (filled by JS) -->
<div class="hero" id="hero">
  <div id="hero-content">
    <div class="spinner"></div>
  </div>
</div>

<!-- Filter chips -->
<div class="pub-filters" id="pub-filters" style="display:none;">
  <button class="pub-chip active" data-cat="">🎯 Все</button>
  <button class="pub-chip" data-cat="Электроника">📱 Электроника</button>
  <button class="pub-chip" data-cat="Одежда">👕 Одежда</button>
  <button class="pub-chip" data-cat="Обувь">👟 Обувь</button>
  <button class="pub-chip" data-cat="Дом и дача">🏠 Дом</button>
  <button class="pub-chip" data-cat="Книги">📚 Книги</button>
  <button class="pub-chip" data-cat="Спорт">⚽ Спорт</button>
  <button class="pub-chip" data-cat="Красота">💄 Красота</button>
  <button class="pub-chip" data-cat="Игры">🎮 Игры</button>
  <button class="pub-chip" data-cat="Хобби">🎨 Хобби</button>
  <button class="pub-chip" data-cat="Другое">📦 Другое</button>
</div>

<!-- Items -->
<div class="pub-grid" id="pub-grid">
  <div class="pub-loading">
    <div class="spinner"></div>
    <p>Загрузка вишлиста...</p>
  </div>
</div>

<div class="pub-footer">
  <p>Сделано с ❤️ в <a href="https://t.me">Telegram</a> · <strong>PlanCart</strong></p>
  <p style="margin-top:6px;"><a href="/">Создай свой список покупок →</a></p>
</div>

<!-- Item detail modal -->
<div class="modal-overlay" id="modal-detail" style="display:none;">
  <div class="modal">
    <div class="modal-drag-handle"></div>
    <div class="modal-body" id="modal-detail-body" style="padding:0 0 20px;">
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="/static/js/public.js"></script>
</body>
</html>
